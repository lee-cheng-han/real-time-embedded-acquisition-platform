name: verification

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  host-and-target:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build gcc-arm-none-eabi libnewlib-arm-none-eabi
      - name: Host verification
        run: ./scripts/test.sh
      - name: STM32H563 cross-build
        run: ./scripts/build_target.sh
      - name: Upload machine-readable evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drats-verification
          path: |
            build/host/test-results.xml
            build/target/size-report.json
            build/target/drats_firmware.map
            build/target/drats_firmware.hex
            build/target/drats_firmware.bin
